spring:
  application:
    name: ev-route-planner

  datasource:
    url: jdbc:postgresql://localhost:5432/evplanner
    username: evplanner
    password: evplanner

  flyway:
    enabled: true
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

server:
  port: 8080
# Routing provider: fake (default) or google
# Keep the real key outside source control.
evplanner:
  routing:
    station-corridor-radius-km: 50
    provider: ${EVPLANNER_ROUTING_PROVIDER:fake}
    google:
      api-key: ${GOOGLE_MAPS_API_KEY:}
      base-url: https://routes.googleapis.com
      field-mask: routes.distanceMeters,routes.duration,routes.polyline.geoJsonLinestring
